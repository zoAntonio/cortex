<app-page-header titre="Habitudes">
  <app-fleche sens="prec" label="Année précédente" (click)="changerAnnee(-1)" />
  <strong>{{ annee() }}</strong>
  <app-fleche sens="suiv" label="Année suivante" (click)="changerAnnee(1)" />
</app-page-header>

<app-etat [chargement]="chargement()" [erreur]="erreur()" />

@if (data(); as d) {
  <div class="flex flex-col gap-4">
    @for (h of d.habitudes; track h.cle; let i = $index) {
      <app-carte [style.--cellule-on]="couleur(i)">
        <div class="mb-3 flex items-baseline justify-between">
          <h2 class="text-base font-semibold">{{ h.nom }}</h2>
          <span class="text-sm font-semibold" [style.color]="couleur(i)">{{ h.stats.tauxReussite }}%</span>
        </div>

        <app-heatmap-grid [annee]="d.annee" [jours]="h.jours" />

        <p class="mt-3 flex flex-wrap gap-x-4 gap-y-1 text-xs text-[var(--texte-doux)]">
          <span class="inline-flex items-center gap-1"><app-icone nom="flamme" [taille]="14" /> {{ h.stats.serieEnCours }} en cours</span>
          <span class="inline-flex items-center gap-1"><app-icone nom="trophee" [taille]="14" /> {{ h.stats.meilleureSerie }} record</span>
          <span class="inline-flex items-center gap-1"><app-icone nom="coche" [taille]="14" /> {{ h.stats.total }} jours</span>
        </p>
      </app-carte>
    }
  </div>
}
